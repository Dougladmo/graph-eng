<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph-eng ao vivo</title>
<script src="/theme.js"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" data-drawer="closed">
  <div id="rail">
    <div id="topbar">
      <svg class="logo" width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><rect class="logo-bg" width="64" height="64" rx="15"/><path class="logo-line" d="M17 32 32 19 47 32 32 45Z" stroke-width="2.5" stroke-linejoin="round" fill="none"/><circle class="logo-fg" cx="17" cy="32" r="5"/><circle class="logo-fg" cx="32" cy="19" r="5"/><circle class="logo-ring" cx="32" cy="45" r="3.8" stroke-width="2.5"/><circle class="logo-accent" cx="47" cy="32" r="5"/></svg>
      <span class="brand">graph-eng</span>
      <span id="live" data-state="connecting">conectando</span>
      <button id="rail-close" class="icon-btn" type="button" aria-label="Esconder suas runs" aria-controls="rail" aria-expanded="true"><span class="panel-icon" aria-hidden="true"></span></button>
      <button id="sidebar-toggle" type="button" aria-expanded="false" aria-controls="sidebar"><span class="menu-icon" aria-hidden="true"></span>suas runs</button>
    </div>
    <nav id="sidebar" aria-label="suas runs">
      <div id="run-lists">
        <section class="run-group" id="group-active" hidden>
          <h2>Em andamento</h2>
          <div class="run-list"></div>
        </section>
        <section class="run-group" id="group-done" hidden>
          <h2>Finalizadas</h2>
          <div class="run-list"></div>
        </section>
      </div>
      <div id="sidebar-foot">
        <span id="theme-label">Tema escuro</span>
        <button id="theme-switch" type="button" role="switch" aria-checked="false" aria-labelledby="theme-label"><span class="knob" aria-hidden="true"></span></button>
      </div>
    </nav>
  </div>
  <button id="rail-open" type="button" aria-label="Mostrar suas runs" aria-controls="rail" aria-expanded="false"><svg class="logo" width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><rect class="logo-bg" width="64" height="64" rx="15"/><path class="logo-line" d="M17 32 32 19 47 32 32 45Z" stroke-width="2.5" stroke-linejoin="round" fill="none"/><circle class="logo-fg" cx="17" cy="32" r="5"/><circle class="logo-fg" cx="32" cy="19" r="5"/><circle class="logo-ring" cx="32" cy="45" r="3.8" stroke-width="2.5"/><circle class="logo-accent" cx="47" cy="32" r="5"/></svg><span class="panel-icon" aria-hidden="true"></span></button>
  <main id="board">
    <header id="run-header"></header>
    <p id="conn" role="alert"></p>
    <p id="empty-msg" role="status">Procurando runs do graph-eng…</p>
    <div id="map-scroll">
      <div id="graph">
        <div id="lanes" aria-hidden="true"></div>
        <div id="edges" aria-hidden="true"></div>
        <div id="nodes"></div>
      </div>
    </div>
    <ul id="legend">
      <li><span class="dot" data-variant="empty" aria-hidden="true"></span>ainda não rodou</li>
      <li><span class="dot" data-variant="running" aria-hidden="true"></span>rodando agora</li>
      <li><span class="dot" data-variant="done" aria-hidden="true"></span>já rodou</li>
      <li><span class="dot" data-variant="fail" aria-hidden="true"></span>falhou</li>
      <li><span class="dot" data-variant="skipped" aria-hidden="true"></span>pulado</li>
    </ul>
  </main>
  <aside id="drawer" aria-label="detalhe do nó">
    <div class="grabber" aria-hidden="true"></div>
    <div class="drawer-head">
      <div class="drawer-head-row">
        <p id="drawer-title"></p>
        <button id="drawer-close" type="button" aria-label="Fechar detalhe"><span class="x" aria-hidden="true"></span></button>
      </div>
      <span id="drawer-state" class="pill"></span>
    </div>
    <div id="drawer-body"></div>
  </aside>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
